[tools]
"aqua:owenlamont/ryl" = "0.24.0"
aube = "v2.7.2"
hk = "2.7.0"
jactionlint = "2.3.0"
node = "24.21.0"
"npm:renovate" = { depends = "aube", version = "44.164.7", allow_builds = [
  # re2 downloads a prebuilt binary, without which the validator checks
  # regexes with JavaScript's RegExp rather than the RE2 that Renovate runs
  "re2",
], trust_policy_excludes = [
  # Yarn's lead maintainer published 3.2.2 by hand without provenance, from the
  # release commit yarnpkg/berry@2eb9830, so aube's no-downgrade trust policy
  # refuses it
  "@yarnpkg/libzip@3.2.2",
] }
oxfmt = { depends = "aube", "version" = "0.73.0" }
rumdl = "0.2.79"
# jactionlint runs shellcheck over workflow run: scripts
shellcheck = "0.11.0"
tombi = "1.8.1"
typos = "1.51.1"

[task_config]
includes = ["tasks"]

[tasks.check]
run = "hk check --no-fail-fast"

[tasks.check-pr]
run = "hk check --from-ref origin/main --to-ref HEAD --no-fail-fast"

[tasks.check-all]
run = "hk check --all --no-fail-fast"

[tasks.fix]
run = "hk fix --no-fail-fast"

[tasks.fix-pr]
run = "hk fix --from-ref origin/main --to-ref HEAD --no-fail-fast"

[tasks.fix-all]
run = "hk fix --all --no-fail-fast"

[tasks.ci]
description = "Runs all CI checks - lint"
depends = ["check-auto"]
