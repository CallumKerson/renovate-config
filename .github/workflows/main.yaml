name: Main Build

on:
  push:
    branches: ["main"]

permissions:
  contents: read

# One run at a time so release-please never races itself. A newer push replaces a
# still-pending run, which loses nothing: release-please reads the whole history.
concurrency:
  group: ${{ github.workflow }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run ci

  # A preset needs no build artefacts: the release-please tag and GitHub release are the release
  release-please:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      # The app token, unlike GITHUB_TOKEN, lets the release PR it opens trigger CI
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
